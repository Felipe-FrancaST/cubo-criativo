      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glow1" cx="25%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.75"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.16"/>
